<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08080B; }
  #stage { position: relative; width: 1920px; height: 1080px; font-family: 'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif; }
  .abs { position: absolute; }
  .eyebrow { font-size: 24px; letter-spacing: 0.38em; font-weight: 600; color: #7C93B8; }
  .h-title { font-size: 128px; font-weight: 700; color: #F5F7FA; letter-spacing: -3px; }
  .h-sub  { font-size: 40px; font-weight: 400; color: #AEB8C6; }
  .kicker { font-size: 21px; letter-spacing: 0.32em; font-weight: 600; color: #6E7BA0; }
  .big    { font-size: 66px; font-weight: 650; color: #F5F7FA; letter-spacing: -1px; line-height: 1.25; }
  .note   { font-size: 30px; color: #93A0B4; }
  .panel  { background: #101319; border: 1px solid #262B36; border-radius: 22px; }
  .mono   { font-family: 'Cascadia Code', 'Cascadia Mono', Consolas, monospace; }
  .qrow   { display: flex; align-items: center; justify-content: space-between;
            background: #171B24; border: 1px solid #262B36; border-radius: 14px;
            padding: 0 26px; height: 62px; }
  .qname  { font-size: 28px; font-weight: 600; color: #F5F7FA; }
  .qscale { font-size: 24px; color: #7C8BA3; }
  .pill   { display: inline-flex; align-items: center; justify-content: center;
            border-radius: 999px; font-size: 22px; font-weight: 700; letter-spacing: 0.06em; }
  .chip   { position: absolute; width: 156px; height: 62px; border-radius: 12px;
            background: #14161C; border: 1px solid #262A33; overflow: hidden; }
  .chip .bar { position: absolute; left: 14px; right: 14px; height: 9px; border-radius: 5px; background: #262B36; }
  .chip.answer { border-color: #F2A30F; box-shadow: 0 0 34px rgba(242,163,15,0.45); }
  .rankrow { position: absolute; left: 0; right: 0; height: 86px; border-radius: 16px;
             background: #101319; border: 1px solid #262B36; display: flex; align-items: center; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const params = new URLSearchParams(location.search);
const stage = document.getElementById("stage");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (t, a, d) => clamp((t - a) / d, 0, 1);
const eo = x => 1 - Math.pow(1 - x, 3);
const ei = x => x * x * x;
const rng = (seed => () => (seed = (seed * 9301 + 49297) % 233280) / 233280)(7);

function el(parent, tag, css, text) {
  const d = document.createElement(tag);
  if (css.left !== undefined || css.top !== undefined || css.right !== undefined || css.bottom !== undefined) {
    d.className = "abs";
  }
  for (const k in css) {
    if (k === "className") d.className += " " + css[k];
    else d.style[k] = css[k];
  }
  if (text !== undefined) d.textContent = text;
  parent.appendChild(d);
  return d;
}
function show(d, opacity, tx, ty) {
  d.style.opacity = opacity;
  if (tx !== undefined || ty !== undefined) {
    d.style.transform = `translate(${tx || 0}px, ${ty || 0}px)`;
  }
  return d;
}

/* ---------- palette ---------- */
const C = {
  bg: "#08080B", white: "#F5F7FA", dim: "#93A0B4", faint: "#6E7BA0",
  blue: "#4A9EFF", amber: "#F2A30F", green: "#34D399", red: "#F87171",
  purple: "#A78BFA", ink: "#101319", line: "#262B36",
};
const RERANK = [
  { name: "Jev-Reranker", lat: 218, q: 0.5112, c: C.blue },
  { name: "Cohere v4.0-pro", lat: 611, q: 0.5091, c: "#23272E", edge: "#E5E7EB" },
  { name: "zerank-1 (open)", lat: 500, q: 0.4980, c: C.purple },
  { name: "Qwen3-0.6B (open)", lat: 234, q: 0.4872, c: C.amber },
  { name: "BGE-v2-m3 (open)", lat: 354, q: 0.4724, c: C.green },
  { name: "MiniLM-L6 (open)", lat: 33, q: 0.4485, c: "#D6569B" },
];

function render(t) {
  stage.innerHTML = "";
/* ---------- scene 1 · title (0 - 4.5) ---------- */
{
  const o1 = eo(seg(t, 0.2, 0.9)), o1out = 1 - seg(t, 4.0, 0.5);
  const o = Math.min(o1, o1out);
  show(el(stage, "div", { left: "0px", top: "330px", width: "1920px", textAlign: "center" },
        ), o, 0, (1 - o1) * 40);
  const wrap = stage.lastChild;
  el(wrap, "div", { position: "relative", marginBottom: "26px" }, "").className = "eyebrow";
  wrap.lastChild.textContent = "TECHNICAL OVERVIEW";
  el(wrap, "div", { className: "h-title", position: "relative" }, "Jev-Reranker");
  el(wrap, "div", { className: "h-sub", position: "relative", marginTop: "18px" },
     "Judgment-based context selection for retrieval results.");
  const o2 = eo(seg(t, 2.4, 0.9)) * o1out;
  const sub2 = el(stage, "div", { left: "0px", top: "640px", width: "1920px", textAlign: "center",
    fontSize: "34px", color: "#7C8BA3" }, "not embedding similarity - explicit judgments, then a deterministic ranking");
  show(sub2, o2, 0, (1 - o2) * 24);
}

/* ---------- scene 2 · the setup (4.5 - 10.5) ---------- */
{
  const vis = seg(t, 4.4, 0.6) * (1 - seg(t, 10.1, 0.5));
  if (vis > 0) {
    const head = el(stage, "div", { left: "160px", top: "120px" }, "");
    el(head, "div", { className: "kicker" }, "THE SETUP");
    show(el(head, "div", { className: "big", marginTop: "18px" },
         "A retriever returns 30 candidates."), vis, 0, (1 - vis) * -30);
    const chipVis = eo(seg(t, 5.0, 1.4));
    const cols = 6, cw = 156, ch = 62, gx = 32, gy = 30;
    const x0 = (1920 - (cols * cw + (cols - 1) * gx)) / 2, y0 = 330;
    for (let i = 0; i < 30; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      const delay = i * 0.035;
      const o = eo(seg(t, 5.0 + delay, 0.35)) * vis;
      const chip = el(stage, "div", { className: "chip",
        left: (x0 + c * (cw + gx)) + "px", top: (y0 + r * (ch + gy)) + "px" });
      el(chip, "div", { className: "bar", top: "15px", width: (70 + rng() * 60) + "px" });
      el(chip, "div", { className: "bar", top: "34px", width: (40 + rng() * 80) + "px" });
      show(chip, o, 0, (1 - o) * 20);
    }
    const answer = 17;
    const r = Math.floor(answer / cols), c = answer % cols;
    const achip = el(stage, "div", { className: "chip answer",
      left: (x0 + c * (cw + gx)) + "px", top: (y0 + r * (ch + gy)) + "px" });
    el(achip, "div", { className: "bar", top: "15px", width: "96px", background: "#F2A30F" });
    el(achip, "div", { className: "bar", top: "34px", width: "60px", background: "#3A3020" });
    const ao = eo(seg(t, 7.6, 0.6)) * vis;
    show(achip, ao, 0, (1 - ao) * 10);
    const c1 = el(stage, "div", { left: "0px", top: "760px", width: "1920px", textAlign: "center" }, "");
    el(c1, "div", { className: "note" }, "Somewhere in here: the answer, three near-misses, one outdated fact, one contradiction.");
    const c1o = eo(seg(t, 8.4, 0.7)) * vis;
    show(c1, c1o, 0, 0);
    const c2 = el(stage, "div", { left: "0px", top: "830px", width: "1920px", textAlign: "center" }, "");
    el(c2, "div", { fontSize: "30px", fontWeight: "600", color: "#F5F7FA" }, "The LLM will only read what survives this step.");
    const c2o = eo(seg(t, 9.2, 0.6)) * vis;
    show(c2, c2o, 0, 0);
  }
}

/* ---------- scene 3 · judge + rank (10.5 - 20.5) ---------- */
{
  const vis = seg(t, 10.4, 0.6) * (1 - seg(t, 20.1, 0.5));
  if (vis > 0) {
    const head = el(stage, "div", { left: "160px", top: "110px" }, "");
    el(head, "div", { className: "kicker" }, "STEP 1 - JUDGE");
    show(head, vis, 0, 0);

    // query card
    const q = el(stage, "div", { left: "160px", top: "230px", width: "560px" }, "");
    const qcard = el(q, "div", { className: "panel", padding: "30px 34px" }, "");
    el(qcard, "div", { fontSize: "19px", letterSpacing: "0.28em", fontWeight: "600", color: "#6E7BA0" }, "QUERY");
    el(qcard, "div", { fontSize: "33px", fontWeight: "600", color: "#F5F7FA", marginTop: "12px" },
       "\u201CHow long do refunds take to settle?\u201D");
    show(q, eo(seg(t, 10.8, 0.6)) * vis, -(1 - eo(seg(t, 10.8, 0.6))) * 40);

    // candidate mini-stack under query
    const stack = el(q, "div", { marginTop: "26px" }, "");
    ["candidate doc 07", "candidate doc 12", "candidate doc 21", "candidate doc 03", "candidate doc 27"].forEach((t, i) => {
      const r = el(stack, "div", { background: "#14161C", border: "1px solid #262A36", borderRadius: "12px",
        padding: "14px 20px", marginBottom: "10px", display: "flex", justifyContent: "space-between" }, "");
      el(r, "span", { fontSize: "21px", color: "#C6CEDA" }, t);
      el(r, "span", { fontSize: "19px", color: "#5B6activi7A" }, "");
      r.lastChild.textContent = ["0.61", "0.58", "0.44", "0.39", "0.33"][i];
    });

    // Jev panel
    const p = el(stage, "div", { left: "820px", top: "230px", width: "940px" }, "");
    const panel = el(p, "div", { className: "panel", padding: "34px 38px 28px" }, "");
    const jhead = el(panel, "div", { display: "flex", justifyContent: "space-between", alignItems: "center" }, "");
    el(jhead, "div", { fontSize: "20px", letterSpacing: "0.28em", fontWeight: "600", color: "#6E7BA0" }, "JEV - ONE BATCHED CALL");
    el(jhead, "div", { fontSize: "20px", color: "#34D399", fontWeight: "600" }, "\u2713 1 request \u00B7 ~200 ms");
    const qdef = [
      ["Relevance", "does it answer the query?", "Score 0-3"],
      ["Utility", "can we act on it?", "Score 0-3"],
      ["Superseded", "replaced by something newer?", "yes / no"],
      ["Conflict", "contradicted elsewhere?", "yes / no"],
    ];
    qdef.forEach((qd, i) => {
      const o = eo(seg(t, 11.6 + i * 0.45, 0.45)) * vis;
      const row = el(panel, "div", { className: "qrow", marginTop: "14px" });
      el(row, "span", { className: "qname" }, qd[0]);
      const mid = el(row, "span", { fontSize: "24px", color: "#8FA3BF" }, qd[1]);
      el(row, "span", { className: "qscale" }, qd[2]);
      show(row, o, (1 - o) * 60, 0);
    });

    // STEP 2 - rank (formula)
    const f = el(stage, "div", { left: "160px", top: "830px", width: "1600px" }, "");
    el(f, "div", { className: "kicker", marginBottom: "14px" }, "STEP 2 - RANK, DETERMINISTICALLY");
    const fline = el(f, "div", { className: "mono", fontSize: "40px", color: "#E5E7EB", marginTop: "12px" }, "");
    const parts = [
      ["value = 0.55\u00B7rel + 0.45\u00B7util", "#E5E7EB"],
      ["  \u00D7 (1 - 0.75\u00B7stale)", "#F2A30F"],
      ["  \u00D7 (1 - 0.25\u00B7conflict)", "#F87171"],
    ];
    const fo = eo(seg(t, 14.6, 0.9)) * vis;
    parts.forEach((pr, i) => {
      const sp = document.createElement("span");
      sp.textContent = pr[0];
      sp.style.color = pr[1];
      sp.style.opacity = eo(seg(t, 14.6 + i * 0.45, 0.5));
      fline.appendChild(sp);
    });
    show(f, fo, 0, 0);
  }
}

/* ---------- scene 4 · output (20.5 - 27.5) ---------- */
{
  const vis = seg(t, 20.4, 0.6) * (1 - seg(t, 27.1, 0.5));
  if (vis > 0) {
    const head = el(stage, "div", { left: "160px", top: "110px" }, "");
    el(head, "div", { className: "kicker" }, "THE OUTPUT");
    show(el(head, "div", { className: "big", marginTop: "18px" },
         "Ranked, labeled, and traceable."), vis, 0, (1 - vis) * -30);

    const items = [
      { tag: "USE",      c: C.green,  t: "Refunds settle within 5 business days.",        s: 0.93 },
      { tag: "USE",      c: C.green,  t: "Refund window: 5 business days from delivery.", s: 0.88 },
      { tag: "KEEP",     c: C.blue,   t: "Returns portal opens after the delivery scan.", s: 0.61 },
      { tag: "STALE",    c: C.amber,  t: "OUTDATED: refunds settle in 30 days.",          s: 0.22 },
      { tag: "CONFLICT", c: C.red,    t: "However, refunds never take more than 48 h.",   s: 0.18 },
    ];
    const listTop = 300, rowH = 108;
    items.forEach((it, i) => {
      const rankVis = eo(seg(t, 20.8 + i * 0.28, 0.5)) * vis;
      const row = el(stage, "div", { className: "rankrow",
        left: "160px", width: "1600px", top: (listTop + i * (rowH + 18)) + "px" });
      show(row, rankVis, 0, (1 - rankVis) * 30);
      el(row, "div", { width: "8px", height: "86px", borderRadius: "4px", background: it.c, marginLeft: "4px" });
      el(row, "div", { width: "64px", textAlign: "center", fontSize: "34px", fontWeight: "700",
        color: "#5B647A" }, String(i + 1));
      el(row, "div", { fontSize: "29px", color: "#E5E7EB", marginLeft: "18px", flex: "1" }, it.t);
      const barWrap = el(row, "div", { width: "300px", marginRight: "30px" }, "");
      const bar = el(barWrap, "div", { height: "12px", borderRadius: "6px",
        background: "#1E2430", overflow: "hidden" }, "");
      const fill = el(bar, "div", { height: "12px", borderRadius: "6px", background: it.c,
        width: (it.s * 300) + "px" });
      const bo = eo(seg(t, 21.4 + i * 0.28, 0.5));
      fill.style.width = (it.s * 300 * bo) + "px";
      el(row, "div", { width: "130px", textAlign: "right", marginRight: "26px", fontSize: "26px",
        fontWeight: "700", color: it.c }, it.tag);
    });

    const cap = el(stage, "div", { left: "0px", top: "950px", width: "1920px", textAlign: "center" }, "");
    el(cap, "div", { className: "note" }, "every rank traceable to a judgment - not a black-box score");
    show(cap, eo(seg(t, 24.6, 0.7)) * vis, 0, 0);
  }
}

/* ---------- scene 5 - measured (27.5 - 34) ---------- */
{
  const vis = seg(t, 27.4, 0.6) * (1 - seg(t, 33.6, 0.5));
  if (vis > 0) {
    const head = el(stage, "div", { left: "160px", top: "100px" }, "");
    el(head, "div", { className: "kicker" }, "MEASURED");
    show(el(head, "div", { className: "big", marginTop: "16px" },
         "Same candidates. Same evaluator. Same vantage."), vis, 0, (1 - vis) * -30);

    const px = 180, py = 275, pw = 1150, ph = 555;
    const X = l => (Math.log10(l) - Math.log10(25)) / (Math.log10(750) - Math.log10(25)) * pw;
    const Y = q => ph - (q - 0.40) / (0.15) * ph;
    const plot = el(stage, "div", { left: px + "px", top: py + "px", width: pw + "px", height: ph + "px" });
    const po = eo(seg(t, 27.8, 0.7));
    show(plot, po, (1 - po) * 50, 0);

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", pw); svg.setAttribute("height", ph);
    plot.appendChild(svg);
    const defs = document.createElementNS(svgNS, "defs");
    defs.innerHTML = '<radialGradient id="jg"><stop offset="0%" stop-color="#4A9EFF" stop-opacity="0.5"/>'
      + '<stop offset="100%" stop-color="#4A9EFF" stop-opacity="0"/></radialGradient>';
    svg.appendChild(defs);

    // ideal corner: lower latency, higher quality (fades in, then Jev's home)
    const io = eo(seg(t, 28.9, 0.7)) * vis;
    const idealW = X(360), idealH = Y(0.498);
    const ideal = document.createElementNS(svgNS, "rect");
    ideal.setAttribute("x", 0); ideal.setAttribute("y", 0);
    ideal.setAttribute("width", idealW); ideal.setAttribute("height", idealH);
    ideal.setAttribute("fill", "rgba(74,158,255,0.06)");
    ideal.setAttribute("stroke", "rgba(74,158,255,0.4)");
    ideal.setAttribute("stroke-dasharray", "6 7");
    ideal.setAttribute("opacity", io * 0.9);
    svg.appendChild(ideal);
    const idealLbl = el(stage, "div", { left: (px + 18) + "px", top: (py + 16) + "px" }, "");
    el(idealLbl, "div", { fontSize: "20px", fontWeight: "600", color: "#7C93B8" }, "ideal corner");
    el(idealLbl, "div", { fontSize: "17px", color: "#5B6E8F", marginTop: "4px" }, "lower latency, higher quality");
    show(idealLbl, io, 0, (1 - io) * -10);

    // gridlines + ticks
    [0.42, 0.45, 0.48, 0.51, 0.54].forEach(g => {
      const l = document.createElementNS(svgNS, "line");
      l.setAttribute("x1", 0); l.setAttribute("x2", pw);
      l.setAttribute("y1", Y(g)); l.setAttribute("y2", Y(g));
      l.setAttribute("stroke", "#1E2430"); l.setAttribute("stroke-dasharray", "3 6");
      svg.appendChild(l);
      const lbl = el(stage, "div", { left: (px - 74) + "px", top: (py + Y(g) - 14) + "px", width: "60px",
        textAlign: "right", fontSize: "20px", color: "#5B647A" }, g.toFixed(2));
      show(lbl, vis);
    });
    [33, 100, 218, 400, 700].forEach(ms => {
      const l = document.createElementNS(svgNS, "line");
      l.setAttribute("x1", X(ms)); l.setAttribute("x2", X(ms));
      l.setAttribute("y1", 0); l.setAttribute("y2", ph);
      l.setAttribute("stroke", "#1E2430"); l.setAttribute("stroke-dasharray", "3 6");
      svg.appendChild(l);
      const lbl = el(stage, "div", { left: (px + X(ms) - 30) + "px", top: (py + ph + 14) + "px", width: "60px",
        textAlign: "center", fontSize: "20px", color: "#5B647A" }, ms);
      show(lbl, vis);
    });

    // pareto dashed line MiniLM -> Jev (draws in)
    const paretoO = eo(seg(t, 29.9, 0.6)) * vis;
    const pl = document.createElementNS(svgNS, "line");
    pl.setAttribute("x1", X(33)); pl.setAttribute("y1", Y(0.4485));
    pl.setAttribute("x2", X(218)); pl.setAttribute("y2", Y(0.5112));
    pl.setAttribute("stroke", "#6B7280"); pl.setAttribute("stroke-dasharray", "8 8");
    pl.setAttribute("stroke-width", "2"); pl.setAttribute("opacity", paretoO);
    svg.appendChild(pl);

    // points: staggered fly-in from the right, labels placed to fit
    const pts = [
      { k: "MiniLM-L6 (open)", lat: 33, q: 0.4485, c: "#D6569B", side: "right", at: 28.5 },
      { k: "Qwen3-0.6B (open)", lat: 234, q: 0.4872, c: "#F2A30F", side: "right", at: 28.9 },
      { k: "BGE-v2-m3 (open)", lat: 354, q: 0.4724, c: "#1F9D63", side: "right", at: 29.2 },
      { k: "zerank-1 (open)", lat: 500, q: 0.4980, c: "#A78BFA", side: "left", at: 29.5 },
      { k: "Cohere v4.0-pro", lat: 611, q: 0.5091, c: "#4B5563", side: "left", at: 29.8 },
    ];
    pts.forEach(pt => {
      const o = eo(seg(t, pt.at, 0.5)) * vis;
      const slide = (1 - o) * 46;
      const c = document.createElementNS(svgNS, "circle");
      c.setAttribute("cx", X(pt.lat)); c.setAttribute("cy", Y(pt.q));
      c.setAttribute("r", 12); c.setAttribute("fill", pt.c);
      c.setAttribute("opacity", o);
      c.setAttribute("transform", "translate(" + slide + ", 0)");
      svg.appendChild(c);
      if (pt.side === "left") {
        const lb = el(stage, "div", { left: "0px", top: (py + Y(pt.q) - 15) + "px",
          width: (px + X(pt.lat) - 26) + "px", textAlign: "right" }, "");
        el(lb, "div", { fontSize: "23px", fontWeight: "600", color: "#C6CEDA" }, pt.k);
        show(lb, o);
      } else {
        const lb = el(stage, "div", { left: (px + X(pt.lat) + 20) + "px",
          top: (py + Y(pt.q) - 15) + "px" }, "");
        el(lb, "div", { fontSize: "23px", fontWeight: "600", color: "#C6CEDA" }, pt.k);
        show(lb, o);
      }
    });

    // Jev: beacon rings + glow + label (the hero of this scene)
    const jx = X(218), jy = Y(0.5112);
    const jIn = eo(seg(t, 30.1, 0.55)) * vis;
    const glow = document.createElementNS(svgNS, "circle");
    glow.setAttribute("cx", jx); glow.setAttribute("cy", jy); glow.setAttribute("r", 34);
    glow.setAttribute("fill", "url(#jg)");
    glow.setAttribute("opacity", jIn);
    svg.appendChild(glow);
    const jpt = document.createElementNS(svgNS, "circle");
    jpt.setAttribute("cx", jx); jpt.setAttribute("cy", jy);
    jpt.setAttribute("r", 14); jpt.setAttribute("fill", "#1F6FEB");
    jpt.setAttribute("stroke", "#E5E7EB"); jpt.setAttribute("stroke-width", "2");
    jpt.setAttribute("opacity", jIn);
    svg.appendChild(jpt);
    if (t > 30.7) {
      for (let k = 0; k < 2; k++) {
        const ph_ = ((t - 30.7) / 1.9 + k * 0.5) % 1;
        const ring = document.createElementNS(svgNS, "circle");
        ring.setAttribute("cx", jx); ring.setAttribute("cy", jy);
        ring.setAttribute("r", 14 + 36 * ph_);
        ring.setAttribute("fill", "none");
        ring.setAttribute("stroke", "#4A9EFF");
        ring.setAttribute("stroke-width", (2.5 * (1 - ph_)).toFixed(2));
        ring.setAttribute("opacity", ((1 - ph_) * 0.55 * vis).toFixed(3));
        svg.appendChild(ring);
      }
    }
    const jlb = el(stage, "div", { left: (px + jx - 110) + "px", top: (py + jy - 64) + "px",
      width: "220px", textAlign: "center" }, "");
